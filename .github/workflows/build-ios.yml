name: Build Zielora SideStore IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zielora-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Verify toolchain
        run: |
          set -euo pipefail
          node --version
          npm --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo dependencies
        run: npm run check

      - name: Expo Doctor
        run: npm run doctor

      - name: Verify iOS JavaScript bundle
        run: npm run bundle:ios

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Verify generated iOS engine
        run: |
          set -euo pipefail
          cat ios/Podfile.properties.json
          grep -q '"expo.jsEngine": "jsc"' ios/Podfile.properties.json

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          export NODE_BINARY="$(command -v node)"
          xcodebuild \
            -workspace ios/Zielora.xcworkspace \
            -scheme Zielora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            clean build 2>&1 | tee xcodebuild.log

      - name: Package standard IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload Zielora.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Zielora.ipa Payload
          test -s Zielora.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zielora-SideStore-IPA
          path: Zielora.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Zielora-build-diagnostics
          path: |
            xcodebuild.log
            ios/Podfile.lock
            ios/Podfile.properties.json
          if-no-files-found: ignore
          retention-days: 7
