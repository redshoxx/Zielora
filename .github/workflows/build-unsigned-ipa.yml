name: Build Zielora SideStore IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zielora-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Zielora.xcworkspace \
            -scheme Zielora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package standard IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload Zielora.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Zielora.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zielora-SideStore-IPA
          path: Zielora.ipa
          if-no-files-found: error
